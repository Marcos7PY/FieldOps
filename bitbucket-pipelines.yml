image: maven:3.9-eclipse-temurin-21

definitions:
  caches:
    maven: ~/.m2/repository
    npmweb: frontend/web-admin/node_modules
    npmmobile: frontend/mobile-technician/node_modules
  services:
    docker:
      memory: 3072
  steps:
    - step: &backend-build
        name: Backend build, test and analyse
        caches:
          - maven
        services:
          - docker
        script:
          - cd backend
          - mvn -B clean verify
          - mvn -B sonar:sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.qualitygate.wait=true
        artifacts:
          - "**/target/surefire-reports/**"
          - "**/target/site/jacoco/**"
    - step: &frontend-web-build
        name: Web-admin build and test
        image: node:20
        caches:
          - npmweb
        script:
          - cd frontend/web-admin
          - npm ci
          - npm run lint
          - npm run build -- --configuration production
          - npm run test:ci
    - step: &frontend-mobile-build
        name: Mobile-technician build and test
        image: node:20
        caches:
          - npmmobile
        script:
          - cd frontend/mobile-technician
          - npm ci
          - npm run lint
          - npm run build -- --configuration production
          - npm run test:ci
    - step: &security-scan
        name: Dependency vulnerability scan
        caches:
          - maven
        script:
          - cd backend
          - mvn -B dependency-check:check
        artifacts:
          - "**/target/dependency-check-report.html"

pipelines:
  pull-requests:
    '**':
      - parallel:
          - step: *backend-build
          - step: *frontend-web-build
          - step: *frontend-mobile-build
          - step: *security-scan
  branches:
    develop:
      - step: *backend-build
      - step:
          name: Build container images
          services:
            - docker
          script:
            - export TAG=$BITBUCKET_COMMIT_SHORT
            - |
              for svc in api-gateway auth-service orders-service notification-service analytics-service; do
                docker build -t "fieldops/$svc:$TAG" -f "backend/$svc/Dockerfile" .
              done
    main:
      - step: *backend-build
      - parallel:
          - step: *frontend-web-build
          - step: *frontend-mobile-build
      - step:
          name: Build and push production images
          services:
            - docker
          script:
            - export TAG=${BITBUCKET_TAG:-$BITBUCKET_COMMIT_SHORT}
            - |
              for svc in api-gateway auth-service orders-service notification-service analytics-service; do
                docker build -t "$REGISTRY/fieldops/$svc:$TAG" -t "$REGISTRY/fieldops/$svc:latest" -f "backend/$svc/Dockerfile" .
                docker push "$REGISTRY/fieldops/$svc:$TAG"
                docker push "$REGISTRY/fieldops/$svc:latest"
              done