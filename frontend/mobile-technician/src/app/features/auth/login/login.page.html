<ion-content class="ion-padding ion-text-center login-content">
  <div class="login-wrapper">
    <div class="brand-section">
      <h1 class="brand-title">FieldOps</h1>
      <p class="brand-subtitle">Portal Técnico de Campo</p>
    </div>

    <ion-card class="login-card">
      <ion-card-header>
        <ion-card-title>Iniciar Sesión</ion-card-title>
        <ion-card-subtitle>Ingrese sus credenciales de técnico</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          @if (errorMessage()) {
          <div class="error-banner">
            <ion-note color="danger">{{ errorMessage() }}</ion-note>
          </div>
          }

          <ion-item lines="full" class="form-item">
            <ion-input
              label="Usuario"
              labelPlacement="floating"
              formControlName="username"
              type="text"
              autocomplete="username"
              placeholder="Ej. tech.juan"
              errorText="El nombre de usuario es requerido"
            ></ion-input>
          </ion-item>

          <ion-item lines="full" class="form-item">
            <ion-input
              label="Contraseña"
              labelPlacement="floating"
              formControlName="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              errorText="La contraseña es requerida"
            ></ion-input>
          </ion-item>

          <div class="submit-section">
            <ion-button type="submit" expand="block" [disabled]="loading()" class="login-button">
              @if (loading()) {
              <ion-spinner name="crescent"></ion-spinner>
              } @else { Ingresar al Sistema }
            </ion-button>
          </div>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
