server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  cloud:
    gateway:
      routes:
        - id: auth-service-api
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: auth-service-jwks
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/.well-known/**
        - id: orders-service-work-orders
          uri: ${ORDERS_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/work-orders/**
        - id: orders-service-clients
          uri: ${ORDERS_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/clients/**
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/analytics/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

fieldops:
  cors:
    allowed-origins:
      - "http://localhost:4200"
      - "http://localhost:8100"
      - "http://localhost"
      - "capacitor://localhost"

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"