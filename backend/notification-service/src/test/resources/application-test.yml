spring:
  datasource:
    url: jdbc:h2:mem:fieldops_notifications;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    properties:
      schema.registry.url: mock://test-schema-registry
  mail:
    host: localhost
    port: 1025
