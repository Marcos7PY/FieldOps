spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  key-path: target/test-keys
  access-token-expiration-seconds: 900
  refresh-token-expiration-days: 7
  allow-key-generation: true

fieldops:
  demo-data:
    enabled: true